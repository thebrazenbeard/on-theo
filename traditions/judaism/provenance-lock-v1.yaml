claim_ceiling:
  - "First-century Judaism is internally diverse; one source or sect cannot stand in for all Jews."
  - "Yeshua's disputes with other Jews are intra-Jewish by default unless evidence supports a stronger separation claim."
  - "Conceptual availability does not prove universal belief or simultaneous use by one community."
  - "Messiah language does not by itself entail later Christian incarnation or Trinitarian ontology."
  - "Danielic Son-of-Man interpretation must distinguish Daniel 7's source context from later individualizing or messianic uses."
  - "Resurrection is not equivalent to a generic immortal-soul doctrine."
  - "Gehenna should not be silently equated with a later medieval Christian hell system."
  - "Job's ha-satan should not be flattened into every later demonic/cosmic-adversary ontology."
  - "Late rabbinic texts may preserve older traditions but are not transparent first-century transcripts."
  - "Celsus's Jewish speaker is a literary/source-provenance problem, not automatically a verbatim Jewish informant."
  - "Panthera/Pandera textual traditions do not establish the biological paternity of the historical Yeshua."
  - "Mark 6:3 and John 8:41 do not independently establish a first-century Panthera lineage."

effect_boundary:
  imports_research_branch_bytes: false
  changes_existing_historical_claims: false
  canonical_promotion: false
