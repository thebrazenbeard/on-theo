strongest_results:
  - >
    Quranic recitation is objectively parameterized by articulation,
    pronunciation, elongation, stopping and learned oral rules.
  - >
    Multiple accepted qiraat preserve bounded phonetic, morphological, lexical
    and syntactic variation, rejecting a one-global-acoustic-string model.
  - >
    Selected Sufi dhikr traditions vary between silent/vocal,
    individual/collective and different embodied forms, weakening a sound-only
    universal mechanism.
  - >
    The historically stronger abstraction is constrained local rule systems plus
    authorized variant families.
  - >
    No empirical external effect of recitational exactness or dhikr form is
    established.

