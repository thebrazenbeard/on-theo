  evidence_rule: >
    Current modern organizations are primary evidence for modern Heathenry and
    modern reconstruction claims, not for Viking-age religious facts.

comparison_eligible:
  REVIVAL_RECONSTRUCTION_MODEL:
    status: BOUNDED
    strongest_result: >
      Modern Heathen communities reconstruct, revive and renew older Germanic
      religious source traditions while selecting, adapting and inventing
      practices under current conditions.

  CONTINUITY_MODEL:
    status: BOUNDED
    subtype: INTERRUPTED_REVIVAL_WITH_RECONSTRUCTION
    guards:
      - REVIVAL_NE_UNBROKEN_SURVIVAL

  RITUAL_ORDER_MODEL:
    status: BOUNDED_CURRENT
    strongest_result: >
      Current ritual order includes organizationally recognized blót and
      life-cycle practices alongside substantial local and personal variation.

  INSTITUTIONALIZATION_MODEL:
    status: BOUNDED_CURRENT
    strongest_result: >
      Modern Heathen organizations institutionalize religious service,
      governance, ritual leadership, education and community without one shared
      transnational church architecture.

  AGENCY_AND_AUTHORITY_MODEL:
    status: BOUNDED_CURRENT
    strongest_result: >
      Modern authority ranges from goðar and formal organizational offices to
      strong personal-practice autonomy.

  SACRAL_PRESENCE_MODEL:
    status: BOUNDED_CURRENT
    strongest_result: >
      Current organizations explicitly relate to gods, ancestors, land/house
      spirits and other beings, with significant theological variation.

  SACRED_TIME_CALENDAR_MODEL:
    status: PARTIAL
    source: ASATRUARFELAGID
    strongest_result: >
      A current Icelandic organization institutionally schedules principal
      blóts through seasonal/calendar structure.
    guard:
      - CURRENT_CALENDAR_NE_ANCIENT_CALENDAR_IDENTITY

held_or_not_admitted:
  WORLD_ORIGIN_MODEL: NOT_ADMITTED_CURRENT_SUCCESSOR_PACKET
  POSTMORTEM_PATH_MODEL: HOLD
  POLITICAL_SACRALIZATION_MODEL: NOT_ADMITTED
