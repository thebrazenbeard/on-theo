method_result:
  acknowledged_innovation_control:
    source: ASATRUARFELAGID_SIDFESTA
    result: >
      A revival community can explicitly acknowledge a rite as modern and still
      treat it as religiously authentic within the living tradition.

readiness_result:
  modern_successor_layer_complete_for_bounded_comparison: true
  ancient_modern_reverse_projection_allowed: false
  exact_current_organization_scope_required: true

strongest_result: >
  Modern Heathenry is a plural revival field whose current organizations provide
  bounded evidence for reconstruction, institutionalization, ritual and
  contemporary theology while supplying no direct shortcut around the
  fragmentary ancient Norse record.

