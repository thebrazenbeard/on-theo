corpus_level_controls:
  - proposition: >
      The 62 BCE Nemrut Dag object, the 72/43 BCE Balbillus examples, and the
      10 BCE papyrus belong to different witness classes.
    confidence: high
  - proposition: >
      Greek documentary horoscopes frequently preserve chronological and
      astronomical chart data with little explicit interpretive prose.
    confidence: high
  - proposition: >
      Handbook astrology and documentary horoscope practice must remain separate
      evidence streams.
    confidence: high
  - proposition: >
      Around 350 Greek horoscopes have been identified in the broader surviving
      Greco-Roman corpus, far more than the 28 cuneiform Babylonian horoscope tablets.
    confidence: medium_high
    source: https://dokumen.pub/between-greece-and-babylonia-hellenistic-intellectual-history-in-cross-cultural-perspective-9781108419550-9781108303552-1108419550.html

