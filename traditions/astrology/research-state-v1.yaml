status: BLIND_BENCHMARK_HARDENED_V7
merge_status: UNMERGED

simulation:
  development_generator:
    path: experiments/astrology/reference_simulation.py
    status: IMPLEMENTED_SYNTHETIC_V1
    blind_safe: false
    reason:
      - world_label_in_development_manifest
      - latent_birth_fields_in_development_output
      - model_probability_and_trait_state_in_development_output

  blind_benchmark:
    generator: experiments/astrology/blind_benchmark.py
    scorer: experiments/astrology/score_benchmark.py
    protocol: experiments/astrology/BLIND_BENCHMARK.md
    status: IMPLEMENTED_V1
    world_classes: 8
    public_projection:
      births:
        - agent_id
        - birth_t
      celestial_state:
        - orbital_longitudes
        - distance_proxies
        - illumination
        - physical_proxy
        - tidal_proxy
        - angular_code
        - sign_code
      outcomes:
        - t
        - agent_id
        - binary_outcome
        - known_environment
      culture:
        - observable_cultural_claims
    withheld:
      - world_label
      - run_seed
      - coupling_class
      - hidden_controller
      - base_trait
      - initialized_trait
      - birth_signal
      - current_trait
      - exact_model_probability
      - private_cultural_belief_state
    integrity:
      seed_commitment: SHA256
      answer_key_commitment: SHA256
      frozen_submission_required: true
      answer_key_commitment_verification_supported: true

  scoring:
    outputs:
      - coverage
      - exact_accuracy
      - unresolved_count
      - per_world_recall
      - confusion_matrix
    unresolved_class_allowed: true

  tests:
    reference_simulation_previous: 5_of_5_PASS
    blind_benchmark_local_precommit: 7_of_7_PASS
    note: LOCAL_TEST_PASS_NE_CI_NE_DEPLOYMENT_NE_SCIENTIFIC_VALIDATION

historical_corpus:
  babylonian:
    top_level_catalog_complete: true
    horoscope_texts: 28
    birth_notes: 4
  greek:
    earliest_papyrus_anchor: BKT_X_29_P11831_29_BCE
