source_theory:
  - proposition: >
      Valens explicitly distinguishes Fortune for bodily matters from Daimon for
      action/employment in Book IV.4.
    confidence: high
  - proposition: >
      Valens presents multiple competing timing systems and attributes some to
      named predecessors or schools.
    confidence: high
  - proposition: >
      Valens cannot be reduced to a single “zodiacal releasing” technique; the
      Anthologies are a plural collection of timing algorithms, lots, place
      judgments, aspects, planetary periods, and worked examples.
    confidence: high

