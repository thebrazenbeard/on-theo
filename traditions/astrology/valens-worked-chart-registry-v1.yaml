  title: Anthologies
  period: second_century_CE
  note: >
    Valens repeatedly uses concrete nativities as worked examples. Dates below
    are modern reconstructions/cross-identifications, commonly through Greek
    Horoscopes, and therefore are not equivalent to explicit Julian dates written
    by Valens.

