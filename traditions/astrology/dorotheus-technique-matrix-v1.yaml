        confidence: high

  - book: V
    main_scope: interrogations_inceptions_and_elections
    verified_topics:
      - Moon_condition
      - crooked_and_straight_signs
      - building
      - hiring
      - land_purchase
      - animal_purchase
      - asking_favors
      - marriage_disputes
      - pregnancy
      - debt
      - journeys
      - ships
      - messages
      - imprisonment
      - illness
      - property_change
      - runaways
    source: https://books.google.com/books?id=XiZhP1MiUbEC
    guard: >
      Modern categories “horary” and “electional” overlap imperfectly with the
      transmitted Book V material. Preserve the actual question/inception topic.

core_observations:
  - proposition: >
      Triplicity rulership is a central organizing device in Dorotheus and changes
      by day/night sect.
    confidence: high
  - proposition: >
      Dorotheus uses numerous calculated lots beyond Fortune, showing that later
      simplified “planets/signs/houses only” summaries omit important Hellenistic practice.
    confidence: high
  - proposition: >
      The transmitted Carmen is itself a cross-language historical artifact, so a
      doctrine in the Arabic recension is not automatically guaranteed to be untouched
      first-century Greek wording.
    confidence: high

