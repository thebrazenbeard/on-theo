      - technique: sect_sensitive_delineation
        evidence: triplicity_ruler_order
        confidence: high
      - technique: Lot_of_Fortune
        chapter: "I.26 according to later source cross-reference"
        confidence: medium_high
      - technique: topical_lots
        examples:
          - father
          - mother
          - brothers
        chapter_examples:
          father: "I.13"
          mother: "I.14"
          brothers: "I.19"
        confidence: high
      - technique: ascensional_times
        confidence: high
      - technique: terms_bounds
        confidence: high
      - technique: dodecatemoria
        confidence: high

  - book: II
    main_scope: marriage_children_and_planetary_conditions
    verified_techniques:
      - technique: triplicity_rulers_of_Venus_for_marriage
        chapter: "II.1"
        confidence: high
      - technique: marriage_and_children_topic_judgment
        confidence: high
      - technique: planetary_aspect_delineation
        confidence: high
      - technique: planets_in_places
        confidence: high

  - book: III
