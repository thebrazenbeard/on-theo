editorial_controls:
  - MANUSCRIPT_READING_NE_EDITORIAL_EMENDATION
  - SIGLUM_NE_SINGLE_UNCHANGING_PHYSICAL_SOURCE
  - PHOTOGRAPH_OR_MICROFILM_NE_MANUSCRIPT
  - TESTIMONIUM_NE_DIRECT_COPY
  - PINGREE_1978_RECONSTRUCTION_NE_MANUSCRIPT_FACT
  - MAK_2013_REASSESSMENT_NE_FINAL_CRITICAL_EDITION

key_implication: >
  Pingree's decisive chronological readings were built under materially poorer
  manuscript conditions than the 2011-2012 reassessment. Therefore fixed dates
  dependent on those readings cannot be treated as primary-text facts.

