corpus_inferences:
  - proposition: >
      Babylonian birth horoscopes are primarily compact astronomical birth-state
      records, with explicit individual prognostication present only in some members.
    classification: HISTORICAL_RECONSTRUCTION
    confidence: high
  - proposition: >
      The genre presupposes methods for obtaining celestial positions even when
      bodies were not observable at the birth moment.
    classification: HISTORICAL_RECONSTRUCTION
    confidence: high
  - proposition: >
      The known corpus does not contain the full Hellenistic apparatus of ascendant-
      based houses and later handbook delineation.
    classification: HISTORICAL_RECONSTRUCTION
    confidence: high

