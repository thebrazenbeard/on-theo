  subsequent:
    - PERSON_SELF_CROSS_TRADITION_EXPANSION_WITH_JAIN
    - POSTMORTEM_PATH_CROSS_TRADITION_EXPANSION_WITH_JAIN
    - POST_JAIN_GLOBAL_GAP_AUDIT_V1

guards:
  - COMPARISON_READY_NE_TRADITION_COMPLETE
  - SECTARIAN_SCOPE_REQUIRED
