name: Build byte-bound promotion candidate

on:
  push:
    branches:
      - candidate/byte-bound-promotion-v1-20260918
    paths:
      - '.github/workflows/build-byte-bound-promotion-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_SUBJECT: 093e8067bc9654fcef70f2ac13a68bc3f800fd22
      SOURCE_TREE: 0c4280f1739d5eda57b421957edf38f85da89a50
      CONTROL_PREDECESSOR: d81ab5ab58f326b0827dbc0f9903befb5580947e
      CANDIDATE_BRANCH: candidate/byte-bound-promotion-v1-20260918
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/byte-bound-promotion-v1-20260918

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify one-shot builder frontier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SUBJECT"
          test "$(git rev-parse "$SOURCE_SUBJECT^{tree}")" = "$SOURCE_TREE"
          CHANGED="$(git diff --name-only "$SOURCE_SUBJECT"..HEAD)"
          test "$CHANGED" = ".github/workflows/build-byte-bound-promotion-candidate.yml"
          REMOTE="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$GITHUB_SHA"

      - name: Build isolated reviewed output
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/on-theo-source "$SOURCE_SUBJECT"
          python /tmp/on-theo-source/scripts/rehearse_materialization.py             --root /tmp/on-theo-source             --output-dir /tmp/on-theo-materialized

      - name: Verify reviewed output digests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-output.sha256 <<'EOF'
          89c4422a2e7d03ecc2997fc6a0be5c24f80cbe4fa338a62afbf24ec815bb99b6  registry/claims.yaml
          a8a7354ccd1bbf0aae0ee0f6fdda8545098027297bbde004c57ee8a895f44b97  registry/concepts.yaml
          6f5c21bdd3c32446194ae7ca9b2d7e7b25dc130967006cba11bd6f2d6c9f3bd9  registry/extension-manifest.yaml
          0f7ed711f8d089a778526bf5a042e708f10cd05de39edbebfc3bb096f3cc1a72  registry/reviews.yaml
          6c97263769c615ac5863ed879da857f58ebfda2031c799d50ef683623efc0d5a  registry/source-access.yaml
          b5e54df4eb984c0f30865be08d33dd7bc711bacba3f6596cef2e370e30cf1d56  registry/sources.yaml
          423f746b65e93fb5efa54ad17490fdbbe8f3f84bec094d9dead55954a8ad770d  registry/transmissions.yaml
          7e22b5b0c46065eeb12108ee14e3c34a818f4d45062f9a99ad4e3b7f6b42e49a  registry/witnesses.yaml
          EOF
          (cd /tmp/on-theo-materialized && sha256sum -c /tmp/expected-output.sha256)

      - name: Archive exact materialization inputs
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="provenance/materialization-input-v1"
          mkdir -p "$ARCHIVE/registry/extensions" "$ARCHIVE/digests"

          cp /tmp/on-theo-source/registry/extension-manifest.yaml "$ARCHIVE/registry/extension-manifest.yaml"
          cp /tmp/on-theo-source/registry/extensions/*.yaml "$ARCHIVE/registry/extensions/"

          COUNT="$(find "$ARCHIVE/registry/extensions" -maxdepth 1 -type f -name '*.yaml' | wc -l | tr -d ' ')"
          test "$COUNT" = "20"

          cmp /tmp/on-theo-source/registry/extension-manifest.yaml "$ARCHIVE/registry/extension-manifest.yaml"
          for src in /tmp/on-theo-source/registry/extensions/*.yaml; do
            cmp "$src" "$ARCHIVE/registry/extensions/$(basename "$src")"
          done

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import yaml

          root = Path("/tmp/on-theo-source")
          archive = Path("provenance/materialization-input-v1")

          source = {
              "schema_version": "on-theo.promotion-input-source.v1",
              "status": "ARCHIVED_INPUT_NOT_CANONICAL",
              "repository": "thebrazenbeard/on-theo",
              "source_subject": "093e8067bc9654fcef70f2ac13a68bc3f800fd22",
              "source_tree": "0c4280f1739d5eda57b421957edf38f85da89a50",
              "control_predecessor": "d81ab5ab58f326b0827dbc0f9903befb5580947e",
              "extension_count": 20,
              "effect_boundary": {
                  "canonical_materialized": False,
                  "merged": False,
              },
          }
          (archive / "source-subject.yaml").write_text(
              yaml.safe_dump(source, sort_keys=False), encoding="utf-8"
          )

          ext = {}
          for path in sorted((root / "registry/extensions").glob("*.yaml")):
              ext[path.name] = sha256(path.read_bytes()).hexdigest()
          (archive / "digests/extension-sha256.yaml").write_text(
              yaml.safe_dump(
                  {
                      "schema_version": "on-theo.extension-sha256.v1",
                      "count": len(ext),
                      "files": ext,
                  },
                  sort_keys=False,
              ),
              encoding="utf-8",
          )

          registry_files = [
              "registry/claims.yaml",
              "registry/concepts.yaml",
              "registry/extension-manifest.yaml",
              "registry/reviews.yaml",
              "registry/source-access.yaml",
              "registry/sources.yaml",
              "registry/transmissions.yaml",
              "registry/witnesses.yaml",
          ]
          before = {
              rel: sha256((root / rel).read_bytes()).hexdigest()
              for rel in registry_files
          }
          (archive / "digests/source-registry-sha256.yaml").write_text(
              yaml.safe_dump(
                  {
                      "schema_version": "on-theo.source-registry-sha256.v1",
                      "source_subject": "093e8067bc9654fcef70f2ac13a68bc3f800fd22",
                      "files": before,
                  },
                  sort_keys=False,
              ),
              encoding="utf-8",
          )
          PY

      - name: Apply exact reviewed materialized bytes
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/on-theo-materialized/registry/*.yaml registry/
          rm -f registry/extensions/*.yaml
          rmdir registry/extensions

          cat > /tmp/expected-output.sha256 <<'EOF'
          89c4422a2e7d03ecc2997fc6a0be5c24f80cbe4fa338a62afbf24ec815bb99b6  registry/claims.yaml
          a8a7354ccd1bbf0aae0ee0f6fdda8545098027297bbde004c57ee8a895f44b97  registry/concepts.yaml
          6f5c21bdd3c32446194ae7ca9b2d7e7b25dc130967006cba11bd6f2d6c9f3bd9  registry/extension-manifest.yaml
          0f7ed711f8d089a778526bf5a042e708f10cd05de39edbebfc3bb096f3cc1a72  registry/reviews.yaml
          6c97263769c615ac5863ed879da857f58ebfda2031c799d50ef683623efc0d5a  registry/source-access.yaml
          b5e54df4eb984c0f30865be08d33dd7bc711bacba3f6596cef2e370e30cf1d56  registry/sources.yaml
          423f746b65e93fb5efa54ad17490fdbbe8f3f84bec094d9dead55954a8ad770d  registry/transmissions.yaml
          7e22b5b0c46065eeb12108ee14e3c34a818f4d45062f9a99ad4e3b7f6b42e49a  registry/witnesses.yaml
          EOF
          sha256sum -c /tmp/expected-output.sha256

          python scripts/validate_registry.py --root . --json
          pytest -q

      - name: Commit candidate payload with CAS
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry provenance
          git status --short
          git commit -m "candidate: materialize reviewed registry bytes"
          PAYLOAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"

          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

          {
            echo "payload_commit=$PAYLOAD"
            echo "payload_tree=$TREE"
          } >> "$GITHUB_STEP_SUMMARY"
