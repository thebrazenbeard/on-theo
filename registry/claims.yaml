claims:
- id: CLM-CELSUS-VIRGIN-BIRTH-COUNTERCLAIM
  proposition: In Contra Celsum I.28, Origen represents Celsus's Jewish speaker as accusing Jesus of inventing a virgin-birth
    account and describes an adulterous/illegitimate-birth counter-story.
  claim_type: TEXTUAL_OCCURRENCE
  evidence_class:
  - PRIMARY_TEXT
  traditions:
  - greco-roman
  - christianity
  - jewish-countertradition
  supporting_sources:
  - source_id: SRC-ORIGEN-CONTRA-CELSUM
    locator: Book I, chapter 28
    relation: DIRECT_TEXTUAL_SUPPORT
    access_mode: ORIGEN_REPORTING_CELSUS
  opposing_sources: []
  confidence: high
  contested: false
  notes:
  - High confidence applies to what Origen's extant text reports, not to the biological truth of Celsus's accusation.
