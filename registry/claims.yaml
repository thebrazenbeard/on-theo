  - christianity
  supporting_sources: []
  opposing_sources: []
  confidence: unresolved
  contested: true
  notes:
  - V1 intentionally does not promote the identification from the similarity of names and motifs alone.
  - Add variant manuscripts, Tosefta/Sanhedrin parallels, and competing scholarship before changing this status.
- id: CLM-CELSUS-JEW-PRESERVES-AUTHENTIC-JEWISH-SOURCE
  proposition: The material assigned by Origen to Celsus's Jewish speaker substantially derives from an authentic second-century
    Jewish source rather than being principally a literary construction by Celsus.
  claim_type: SOURCE_PROVENANCE
  evidence_class:
  - SCHOLARLY_INTERPRETATION
  traditions:
  - greco-roman
  - judaism
  - christianity
  supporting_sources:
  - source_id: SCH-BLUMELL-2007-CELSUS-JEW
    locator: article argument
    relation: SCHOLARLY_SUPPORT
    access_mode: PUBLISHER_ABSTRACT_AND_BIBLIOGRAPHIC_RECORD
  - source_id: SCH-NIEHOFF-2013-CELSUS-JEW
    locator: article argument
    relation: SCHOLARLY_SUPPORT
    access_mode: INSTITUTIONAL_ABSTRACT_AND_BIBLIOGRAPHIC_RECORD
  opposing_sources: []
  confidence: unresolved
  contested: true
  alternatives:
  - Celsus composed or substantially reshaped the Jewish speaker for literary/polemical purposes.
  - Celsus used Jewish material but not a single recoverable written Jewish source.
  notes:
  - Niehoff's specific Alexandrian written-source thesis is attributed scholarship, not repository fact.
