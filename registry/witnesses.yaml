schema_version: on-theo.witness-registry.v1
status: PROPOSED_CANONICAL_CONTRACT
materialization_state: REHEARSAL_MATERIALIZED_NOT_CANONICAL
notes:
- A work/source and a physical witness are distinct identities.
- Witness date must never be promoted to work composition date or claimed-event date.
- A witness-specific reading must never be promoted to all witnesses or to the reconstructed work without an explicit textual-critical
  inference.
- Digital edition, apparatus, image, transcription, and autoptic readback are distinct access modes.
required_fields:
- id
- witness_of
- witness_kind
- witness_date
- access_mode
- locators
optional_fields:
- common_name
- shelfmark
- provenance_note
- custody
- language
- limitations
- source_extension
claim_edge_contract:
  required:
  - source_id
  optional:
  - witness_id
  invariant: When a proposition depends on a witness-specific reading, witness_id is required.
materialization_rules:
- Witness additions originate in reviewed registry extensions and become canonical only through a reviewed materialization
  cut.
- Duplicate witness IDs are a collision and must stop materialization unless the records are byte/semantic-equivalent under
  an explicit supersession rule.
- A later witness may preserve older wording, but age of wording is a separate inference and is not derived from witness date
  alone.
