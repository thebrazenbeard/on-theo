  witness_kind: manuscript
  common_name: Vienna manuscript of the Tosefta
  shelfmark: Österreichische Nationalbibliothek Cod. hebr. 20
  witness_date:
    start: '1300'
    end: '1399'
    precision: early-fourteenth-century
  provenance_note: Cambridge History of Judaism describes the Vienna manuscript as an early-fourteenth-century Spanish witness
    and the only nearly complete manuscript of the Tosefta.
  access_mode: digital-edition-manuscript-layer
  locators:
  - passage: Tosefta Chullin 2:6; Vienna manuscript locations 226v-227r shown by Sefaria
    url: https://www.sefaria.org/Tosefta_Chullin.2.6?lang=bi&with=manuscripts
  limitations:
  - V1 reads Sefaria's manuscript-aware annotation and images/metadata layer; it does not claim an independent palaeographic
    re-dating.
  - A medieval witness can preserve older wording, but witness date and composition/origin date remain separate clocks.
