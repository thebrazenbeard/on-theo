schema_version: on-theo.source-access-registry.v1
status: PROPOSED_CANONICAL_CONTRACT
invariants:
  - "Source identity is not access identity."
  - "A lost work may be a source node while remaining inaccessible except through later preservation."
  - "A modern website, edition, translation, transcription, apparatus, or manuscript image is an access surface, not automatically the ancient source or physical witness."
  - "Direct access claims require an extant witness or edition representing extant witnesses; indirect preservation must name the intermediary."
access_states:
  DIRECT_EXTANT: "The work/artifact is extant in a form directly represented by the registered access surface, subject to normal edition/witness limits."
  INDIRECT_PRESERVATION: "The source is lost or unavailable directly and is known through a preserving/intermediary source."
  MATERIAL_TRANSCRIPTION: "The artifact is extant materially; current access is through a transcription/database rather than autopsy."
  DIGITAL_EDITION: "The work is accessed through a modern digital edition/translation."
  SCHOLARLY_SUMMARY: "The current claim is accessed only through modern scholarly reporting/summary."
records:
  - source_id: SRC-CELSUS-TRUE-DOCTRINE
    direct_access: false
    state: INDIRECT_PRESERVATION
    preserved_by:
      - SRC-ORIGEN-CONTRA-CELSUM
    guard: "No proposition may cite Celsus as directly read wording unless it explicitly binds the Origen preservation layer or another independently established witness."

  - source_id: SRC-ORIGEN-CONTRA-CELSUM
    direct_access: true
    state: DIGITAL_EDITION
    guard: "Modern translation/readback supports what the extant Origen tradition says; it does not erase manuscript/editorial history."

  - source_id: MAT-ABDES-PANTERA-INSCRIPTION
    direct_access: false
    state: MATERIAL_TRANSCRIPTION
    guard: "Current V1 access is through institutional/scholarly transcription and metadata, not an autoptic artifact examination."

  - source_id: SRC-BAVLI-SHABBAT-104B
    direct_access: true
    state: DIGITAL_EDITION
    guard: "The digital edition is an access surface; manuscript/edition-specific differences require witness-level records."

  - source_id: SRC-TOSEFTA-CHULLIN-2-6
    direct_access: true
    state: DIGITAL_EDITION
    guard: "Witness-specific readings must bind a witness_id; the work record does not inherit the date or reading of the Vienna manuscript."

  - source_id: SRC-GOSPEL-MARK
    direct_access: true
    state: DIGITAL_EDITION
    guard: "Critical-text wording is editorial reconstruction; P45-specific readings require witness_id WIT-P45-MARK-6-3."

  - source_id: SRC-GOSPEL-JOHN
    direct_access: true
    state: DIGITAL_EDITION
    guard: "Critical-text/translation access does not by itself resolve semantic interpretation or composition chronology."

  - source_id: SRC-ORIGEN-COMMENTARY-JOHN
    direct_access: false
    state: SCHOLARLY_SUMMARY
    guard: "Current V1 exact locator comes through Harlow quoting Heine; Greek collation remains pending."
