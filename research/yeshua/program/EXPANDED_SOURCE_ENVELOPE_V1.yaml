schema_version: on-theo.yeshua-expanded-source-envelope.v1
status: PROGRAM_LEVEL_ROUTING
program: THE_REAL_TESTAMENT_OF_YESHUA
canonical: false

source_families:
  HEBREW_BIBLE_TEXTUAL_TRADITIONS:
    default_tier: B
    uses: [SCRIPTURAL_CONTEXT, LEXICAL_CONTEXT, RECEPTION]
  SECOND_TEMPLE_APOCRYPHA_PSEUDEPIGRAPHA:
    default_tier: B
    controls: [WORK_SPECIFIC_DATE, COMPOSITE_LAYERING, WITNESS_DATE]
  DEAD_SEA_SCROLLS:
    default_tier: B
    controls: [SECTARIAN_VS_NONSECTARIAN, QUMRAN_RELATION, WITNESS_PROVENANCE]
  JOSEPHUS_PHILO:
    default_tier: B
    exception: JOSEPHUS_JESUS_JAMES_JOHN_PASSAGES_MAY_ENTER_A_WITH_PASSAGE_CONTROLS
  EARLY_RABBINIC:
    default_tier: D
    uses: [TRAJECTORY, LATER_MEMORY, LEGAL_COMPARISON]
  CANONICAL_EARLY_CHRISTIAN:
    default_tier: A_OR_C_BY_WORK
    controls: [COMPOSITION_DATE, LITERARY_DEPENDENCE, WITNESS]
  EARLY_NONCANONICAL_CHRISTIAN:
    default_tier: C_OR_D
    controls: [INDEPENDENCE, SOURCE_STRATIFICATION, WITNESS]
  NAG_HAMMADI_SOURCE_SPECIFIC:
    default_tier: C_OR_D
    controls:
      - GNOSTICISM_CATEGORY_NOT_ASSUMED
      - MANUSCRIPT_NE_COMPOSITION
      - TRACTATE_SPECIFIC
  EARLY_JEWISH_VISIONARY:
    default_tier: B
    uses: [APOCALYPTIC_CONTEXT, HEAVENLY_LITURGY, VISIONARY_CONTEXT]
  HEKHALOT_MERKAVAH:
    default_tier: D_OR_E
    controls: [LATE_ANTIQUE_MEDIEVAL_REDACTION, ANTECEDENT_NE_IDENTITY]
  KABBALAH:
    default_tier: D_OR_E
    controls:
      - MEDIEVAL_PROPER
      - SEFER_YETZIRAH_AS_ANTECEDENT_NOT_FIRST_CENTURY_KABBALAH
      - NO_BACK_PROJECTION
  GRECO_ROMAN_COMPARATORS:
    default_tier: B_OR_E
    controls: [CULT_SPECIFIC, CONTACT_NE_BORROWING]

research_lanes:
  R1:
    allowed_default: [TIER_A, BOUNDED_TIER_B_CONTEXT]
    prohibited_gap_fill: [TIER_C, TIER_D, TIER_E]
  R2:
    allowed: [TIER_A, TIER_B]
    challenge_only: [TIER_C]
  R3_R6:
    allowed: [TIER_A, TIER_B, SOURCE_CLOCKED_TIER_C_D]
  R7:
    primary: [TIER_C, TIER_D]
  R8:
    primary: [TIER_A, TIER_B, TIER_C, TIER_D, TIER_E]
    rule: HISTORICAL_YESHUA_PROMOTION_REQUIRES_A_OR_DEMONSTRATED_C_INDEPENDENCE
  R9:
    primary: [ALL_TIERS_FOR_RECEPTION_AND_TRANSMISSION]

critical_guards:
  - SOURCE_RELEVANCE_NE_SOURCE_EQUIVALENCE
  - RECEPTION_NE_HISTORICAL_YESHUA
  - LATER_PARALLEL_NE_ANTECEDENT
  - JUDAISM_NE_ONE_THEOLOGY
  - GNOSTICISM_NE_ONE_ANCIENT_RELIGION
  - KABBALAH_NE_SECOND_TEMPLE_CONTEXT
  - MYSTICAL_ANALOGY_NE_TRANSMISSION
