claims:
  - id: CLM-YS-R3-JUD-001-HISTORICAL-JUDAS
    proposition: "A historical follower/insider named Judas Iscariot stands behind the Markan handover tradition."
    disposition: PROBABLE_PENDING_HOSTILE_REVIEW
    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION]
    support:
      - MARKAN_NAMED_INSIDER_TRADITION
      - LATER_BROAD_RETENTION_WITH_VARIATION
    opposing_pressure:
      - PAULINE_SILENCE
      - MARKAN_LITERARY_THEOLOGICAL_MEDIATION
    ceiling: "Does not establish motive, money amount, death, psychology, or all later narrative details."

  - id: CLM-YS-R3-JUD-002-HANDOVER-CORE
    proposition: "Judas probably performed some insider action that facilitated Yeshua's arrest."
    disposition: PROBABLE_PENDING_HOSTILE_REVIEW
    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION]
    ceiling: "Exact function and necessity remain unresolved."

  - id: CLM-YS-R3-JUD-003-LOCATION-TIMING
    proposition: "The most economical historical function for a Judas-like insider is knowledge of timing, secluded location, or access rather than indispensable facial identification."
    disposition: PLAUSIBLE_PENDING_HOSTILE_REVIEW
    evidence_class: [HISTORICAL_RECONSTRUCTION, PROJECT_INFERENCE]
    support:
      - MARK_SECRET_ARREST_OPPORTUNITY_LOGIC
      - JOHN_KNOWS_MEETING_PLACE
      - JOHN_YESHUA_SELF_IDENTIFIES
    ceiling: "John does not independently prove this function historically."

  - id: CLM-YS-R3-JUD-004-MONEY
    proposition: "Money was already part of the earliest surviving explicit Judas narrative."
    disposition: SURVIVES_AS_TEXTUAL_CLAIM
    evidence_class: [PRIMARY_TEXT]
    support: ["Mark 14:11"]
    ceiling: "Does not prove greed was the historical motive."

  - id: CLM-YS-R3-JUD-005-THIRTY-SILVER
    proposition: "The exact thirty-silver payment is historically established."
    disposition: UNRESOLVED
    evidence_class: [PRIMARY_TEXT, UNKNOWN]
    reason:
      - MATTHEW_SPECIFIC_IN_CURRENT_CLOCK
      - SCRIPTURAL_FULFILLMENT_PRESSURE
      - SYNOPTIC_DEPENDENCE

  - id: CLM-YS-R3-JUD-006-GREED-MOTIVE
    proposition: "Judas historically acted primarily from greed."
    disposition: UNRESOLVED
    evidence_class: [UNKNOWN]
    reason:
      - MARK_MONEY_NE_EXPLICIT_MOTIVE
      - JOHN_THIEF_CHARACTERIZATION_LATER
      - PAPIAS_MORAL_PEDAGOGY_LATER

  - id: CLM-YS-R3-JUD-007-DEMONIC
    proposition: "Satan literally entered Judas and caused the historical handover."
    disposition: NOT_HISTORICALLY_ADJUDICATED
    evidence_class: [PRIMARY_TEXT, THEOLOGICAL_INTERPRETATION, UNKNOWN]
    source_clock: [LUKE, JOHN]
    ceiling: "Direct evidence for later theological characterization, not historical psychology/mechanism."

  - id: CLM-YS-R3-JUD-008-DEATH
    proposition: "The surviving sources establish a single recoverable manner of Judas's death."
    disposition: REJECTED_AS_CURRENTLY_SUPPORTED_CONCLUSION
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION]
    reason:
      - MATTHEW_ACTS_DIVERGENCE
      - PAPIAS_FURTHER_VARIATION
    negation_status: "Judas's historical death remains unknown; contradiction does not prove nonexistence."

  - id: CLM-YS-R3-JUD-009-VILLAIN-EXPANSION
    proposition: "Later extant Judas portrayals add or intensify motive, demonic, theft, death, punishment and fulfillment features beyond Mark."
    disposition: SURVIVES_AS_TEXTUAL_DIACHRONY
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION, HISTORICAL_RECONSTRUCTION]
    ceiling: "Extant sequence does not prove a smooth historical development or original innocence."

  - id: CLM-YS-R3-JUD-010-FULL-INVENTION
    proposition: "Judas as betrayer was wholly invented to scapegoat broader apostolic failure."
    disposition: UNRESOLVED_CURRENTLY_WEAK_TO_MODERATE
    evidence_class: [SPECULATIVE_MODEL]
    missing_positive_evidence:
      - EARLY_ALTERNATIVE_INTENTIONAL_HANDOVER_AGENT
      - EARLY_RIVAL_ACCUSATION_OF_COLLECTIVE_COLLABORATION
      - DIRECT_MEMORY_OF_JUDAS_INVENTION

  - id: CLM-YS-R3-JUD-011-MEMORY-CONCENTRATION
    proposition: "A real Judas role may have been narratively intensified while broader disciple failure remained only as flight/denial."
    disposition: POSSIBLE_LOW_MODERATE
    evidence_class: [PROJECT_INFERENCE, SPECULATIVE_MODEL]
    ceiling: "No current evidence establishes intentional collaboration by non-Judas disciples."

  - id: CLM-YS-R3-JUD-012-AUTHORIZED
    proposition: "Judas acted under Yeshua's secret authorization."
    disposition: REJECTED_AS_CURRENTLY_SUPPORTED_HISTORICAL_CONCLUSION
    evidence_class: [UNKNOWN]
    negation_status: NOT_PROVED
    note: "Gospel of Judas cannot establish this first-century event by reversal alone."

  - id: CLM-YS-R3-JUD-013-COLLECTIVE-AGENTS
    proposition: "Multiple disciples were bribed/recruited as Roman or local-authority agents and Judas became their scapegoat."
    disposition: UNRESOLVED_CURRENTLY_WEAK
    evidence_class: [SPECULATIVE_MODEL]
    missing_positive_evidence:
      - ADMINISTRATIVE_PAYMENT_RECORD
      - EARLY_NAMED_COLLABORATOR_ACCUSATION
      - ANOMALOUS_PROTECTION_PATTERN
      - INDEPENDENT_EARLY_ALTERNATIVE_ARREST_TRADITION

