scholarly_controls:
  - id: SCH-PAUL-SEVEN-UNDISPUTED-CAMBRIDGE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    title: "Paul"
    container: Early Christian Thought in its Jewish Context
    bounded_use: "Seven letters are generally treated as undisputed: Romans, 1-2 Corinthians, Galatians, Philippians, 1 Thessalonians, Philemon."
    url: "https://www.cambridge.org/core/books/abs/early-christian-thought-in-its-jewish-context/paul/655C6C6C4F2A3AFC235BE28F5F9FC8F5"

  - id: SCH-NASRALLAH-2018-PAUL-EARLIEST
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Laura Salah Nasrallah
    title: Archaeology and the Letters of Paul
    bounded_use: "Pauline letters are the earliest surviving evidence for followers of Christ."
    url: "https://academic.oup.com/book/11593/chapter-abstract/160440165"

  - id: SCH-WARE-2014-1COR15
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: James Ware
    title: "The Resurrection of Jesus in the Pre-Pauline Formula of 1 Cor 15.3-5"
    bounded_use: "Supports treating 1 Cor 15:3-5 as a serious pre-Pauline-formula hypothesis while preserving debate over its interpretation."
    url: "https://www.cambridge.org/core/journals/new-testament-studies/article/resurrection-of-jesus-in-the-prepauline-formula-of-1-cor-1535/B98A7CB0EDE64897CAFEE83263BE6289"

  - id: SCH-BRANDON-1961-MARK-DATE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: S. G. F. Brandon
    title: "The Date of the Markan Gospel"
    bounded_use: "Records the long-standing critical dating range around 65-75 CE; exact relation to 70 remains debated."
    url: "https://www.cambridge.org/core/journals/new-testament-studies/article/abs/date-of-the-markan-gospel/B34650230D991C2B56A96866131DC994"

  - id: SCH-MEGGITT-2019-HISTORICITY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Justin J. Meggitt
    title: "More Ingenious than Learned? Examining the Quest for the Non-Historical Jesus"
    bounded_use: "Treats historicity/mythicism as a legitimate historiographical debate to scrutinize without implying equal scholarly support."
    url: "https://www.cambridge.org/core/journals/new-testament-studies/article/abs/more-ingenious-than-learned-examining-the-quest-for-the-nonhistorical-jesus/B1A4799BE91AB5300671D4013194DD4C"

  - id: SCH-LATASTER-2016-MYTHICIST-DISSENT
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Raphael Lataster
    title: "It's Official: We Can Now Doubt Jesus' Historical Existence"
    bounded_use: "Low-weight opposition acquisition: explicit modern scholarly dissent from historicity; not treated as representative of field consensus."
    url: "https://www.cambridge.org/core/journals/think/article/abs/its-official-we-can-now-doubt-jesus-historical-existence/065797C131D37B02B7E33E83D5CDA577"

  - id: SCH-OXBIB-JOHN-BAPTIST-2014
    evidence_class: [SCHOLARLY_INTERPRETATION]
    title: "John the Baptist"
    container: Oxford Bibliographies in Biblical Studies
    bounded_use: "Summarizes John as historically significant and notes the traditional/historical importance of his baptism of Jesus; Josephus independently attests John, not the baptism of Jesus."
    url: "https://academic.oup.com/reference/62341/reference-article-abstract/554100904"

  - id: SCH-CROSSLEY-2015-KINGDOM
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: James G. Crossley
    title: "The Dictatorship of God? Kingdom and Christology"
    bounded_use: "Provides a historically contextualized reconstruction of Kingdom traditions while challenging idealized egalitarian readings."
    url: "https://academic.oup.com/book/41755/chapter-abstract/354220471"

  - id: SCH-PORTERFIELD-2005-HEALER
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Amanda Porterfield
    title: "Jesus: Exorcist and Healer"
    bounded_use: "Healing/exorcism is central to Gospel representation; historical interpretation must distinguish reputation/acts from modern miracle adjudication."
    url: "https://academic.oup.com/book/6310/chapter-abstract/149988911"

  - id: SCH-ANDRADE-2025-PILATE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Nathanael J. Andrade
    title: Killing the Messiah
    bounded_use: "Roman crucifixion under Pilate is secure at high level; exact charge, legal route, and Gospel trial detail remain disputed."
    url: "https://academic.oup.com/book/59249/chapter-abstract/499346768"

  - id: SCH-BOND-1998-PILATE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Helen K. Bond
    title: Pontius Pilate in History and Interpretation
    bounded_use: "Treats crucifixion under Pilate as among the surest historical anchors while separating historical Pilate from literary portrayals."
    url: "https://www.cambridge.org/core/books/abs/pontius-pilate-in-history-and-interpretation/preface/BFE4DF55CCA5A59E787E10FE48D42441"

  - id: SCH-SCHMIDT-2025-JOSEPHUS-JAMES
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: T. C. Schmidt
    title: "James the Brother of Jesus: Antiquities 20.200"
    bounded_use: "Argues strongly for authenticity of Antiquities 20.200 and notes broad scholarly support."
    url: "https://academic.oup.com/book/60034/chapter/513641505"

  - id: SCH-NIR-2026-JOSEPHUS-NT
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Rivka Nir
    title: "John the Baptist, Jesus, and Other New Testament Figures in Josephus' Writings"
    bounded_use: "Recent opposition/control: reviews authenticity debates over Josephus' Jesus, John, and James notices without taking a decisive position."
    url: "https://academic.oup.com/edited-volume/62350/chapter-abstract/554396080"

  - id: SCH-HANSEN-2023-TACITUS-DEPENDENCE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    author: Christopher M. Hansen
    title: "The Problem of Annals 15.44: On the Plinian Origin of Tacitus's Information on Christians"
    bounded_use: "Opposition acquisition against treating Tacitus as automatically independent of Christian/Plinian information."
    url: "https://www.tandfonline.com/doi/abs/10.1080/2222582X.2023.2173628"

