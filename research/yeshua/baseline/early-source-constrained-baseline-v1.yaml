method:
  purpose: "Control reconstruction from the earliest defensible evidence; not the final historical Yeshua."
  exclusions_from_gap_filling:
    - later_noncanonical_sources
    - later_mystical_developments
    - Panthera_countertraditions
    - retrospective_psychological_reconstruction
    - Roman_cultivation_hypotheses
  source_count_guard: "Dependent witnesses do not count as independent lines merely because they are multiple texts."
  later_source_guard: "Later witnesses may corroborate or challenge but do not silently fill early-source gaps."
  metaphysical_guard: "Historical method records resurrection claims/experiences without adjudicating supernatural mechanism."

source_controls:
  - id: SRC-PAUL-GALATIANS
    evidence_class: [PRIMARY_TEXT]
    source_kind: undisputed_pauline_letter
    author_or_tradition: Paul
    composition_date: {start: "0048", end: "0055", precision: broad-critical-range}
    original_language: Greek
    physical_witness:
      witness_id: WIT-P46-PAUL
      date_status: "early Pauline codex commonly dated around the late-second/third-century horizon; exact palaeographic dating remains debated"
      contains_relevant_text: true
    relevant_locators:
      - "Galatians 1:18-19"
      - "Galatians 2:9"
      - "Galatians 4:4"
    limitations:
      - "Paul writes for community disputes and theology, not as a biography of Jesus."
      - "Letter dating within the 40s-50s remains debated."
    access_mode: modern_critical_text_and_translation

  - id: SRC-PAUL-1COR
    evidence_class: [PRIMARY_TEXT]
    source_kind: undisputed_pauline_letter
    author_or_tradition: Paul
    composition_date: {start: "0053", end: "0056", precision: broad-critical-range}
    original_language: Greek
    physical_witness:
      witness_id: WIT-P46-PAUL
      date_status: "early Pauline codex commonly dated around the late-second/third-century horizon; exact palaeographic dating remains debated"
      contains_relevant_text: true
    relevant_locators:
      - "1 Corinthians 7:10-11"
      - "1 Corinthians 9:5"
      - "1 Corinthians 11:23-26"
      - "1 Corinthians 15:3-8"
    limitations:
      - "The extent of pre-Pauline material inside received traditions is a source-critical reconstruction, not a manuscript layer physically labeled as pre-Pauline."
      - "Paul's formulae and traditions may already contain post-death interpretation."
    access_mode: modern_critical_text_and_translation

  - id: SRC-GOSPEL-MARK
    evidence_class: [PRIMARY_TEXT]
    source_kind: canonical_gospel_text
    author_or_tradition: Gospel according to Mark
    composition_date: {start: "0065", end: "0075", precision: common-critical-range-not-unanimous}
    original_language: Greek
    physical_witness:
      witness_id: WIT-P45-MARK
      date_status: "third-century fragmentary Gospel witness"
      contains_all_relevant_text: false
    relevant_locators:
      - "Mark 1:1-15"
      - "Mark 1:16-3:35"
      - "Mark 6:1-6"
      - "Mark 8:27-10:52"
      - "Mark 11:1-15:47"
      - "Mark 16:1-8"
    limitations:
      - "Narrative theology and historical memory are not identical."
      - "Mark is decades after the events and source history inside Mark is not transparent."
      - "P45 does not physically witness every passage used in this baseline."
    inherited_control: registry/extensions/mark6-matronymic-v1.yaml
    access_mode: modern_critical_text_and_translation

  - id: SRC-JOSEPHUS-ANTIQUITIES-18
