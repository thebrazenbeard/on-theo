    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION, SCHOLARLY_INTERPRETATION]

  - id: CLM-FLOOD-003-GENESIS-MESOPOTAMIA
    proposition: "Genesis 6–9 ultimately reworks older Mesopotamian flood tradition rather than independently generating the entire narrative architecture."
    disposition: HIGH_PENDING_HOSTILE_REVIEW
    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION, SCHOLARLY_INTERPRETATION]
    strongest_parallels:
      - BOAT
      - PRESERVATION_OF_LIFE
      - BIRDS
      - MOUNTAIN_REST
      - SACRIFICE
      - DIVINE_SMELL_RESPONSE
      - POST_FLOOD_ORDER_RESET

  - id: CLM-FLOOD-004-ZIUSUDRA-DIRECT
    proposition: "Genesis directly copied the surviving Ziusudra tablet CBS 10673."
    disposition: NOT_ESTABLISHED
    evidence_class: [UNKNOWN]

  - id: CLM-FLOOD-005-NOAH-ZIUSUDRA-IDENTITY
    proposition: "Noah and Ziusudra were the same historical individual."
    disposition: NOT_ESTABLISHED
    evidence_class: [UNKNOWN]

  - id: CLM-FLOOD-006-GENESIS-THEOLOGICAL-REWORK
    proposition: "Genesis materially transforms Mesopotamian flood theology by moralizing the flood cause and replacing pantheon conflict with monotheistic judgment/covenant."
    disposition: HIGH_PENDING_HOSTILE_REVIEW
    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION]

  - id: CLM-FLOOD-007-CONTACT-CAPACITY
    proposition: "Mesopotamian literary traditions had historically plausible routes into Levantine/Judean scribal culture."
