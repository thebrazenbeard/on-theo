  - id: CLM-FLOOD-008-SHURUPPAK-INUNDATION
    proposition: "Shuruppak preserves archaeological evidence of a major inundation around the Jemdet Nasr/Early Dynastic transition."
    disposition: SUPPORTED
    evidence_class: [MATERIAL_EVIDENCE]

  - id: CLM-FLOOD-009-SINGLE-MEGA-FLOOD
    proposition: "Ur, Kish, Shuruppak, and related flood deposits establish one synchronous Mesopotamia-wide flood."
    disposition: NOT_ESTABLISHED
    evidence_class: [MATERIAL_EVIDENCE, HISTORICAL_RECONSTRUCTION]

  - id: CLM-FLOOD-010-GLOBAL-FLOOD
    proposition: "The Mesopotamian archaeological flood deposits establish the literal global flood of Genesis."
    disposition: REJECTED_AS_SUPPORTED_INFERENCE
    negation_status: "This claim state concerns the cited archaeology; it does not claim archaeology can prove every conceivable metaphysical possibility."
    evidence_class: [MATERIAL_EVIDENCE, HISTORICAL_RECONSTRUCTION]

  - id: CLM-FLOOD-011-HISTORICAL-SEED
    proposition: "Repeated severe southern Mesopotamian flooding plausibly contributed to a durable flood-memory complex."
    disposition: PLAUSIBLE
    evidence_class: [MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    ceiling: "No specific archaeological layer is identified as the unique literary event source."

