admission_policy:
  historical_event: "separate primary documentary evidence from poem and commentary"
  theological_influence: "chronology, distinctive correspondence, transmission mechanism and counterexamples"
  textual_proposition: "canto+line, named edition, original-language reading, speaker, translation status"
  manuscript_variant: "identified codex or critical apparatus; no unsourced variants"
  opposing_scholarship: "actively sought for contested, distinctive, institutionally sensitive claims"
