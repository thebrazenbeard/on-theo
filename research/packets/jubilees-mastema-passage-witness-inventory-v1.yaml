claims:
  - id: CLM-JUB-MASTEMA-TWELVE-NAMED-PASSAGES-V1
    proposition: "The current VanderKam-numbered V1 inventory contains twelve direct named-Mastema loci in Jubilees."
    support: [JUB-MASTEMA-10-8, JUB-MASTEMA-11-5, JUB-MASTEMA-11-11, JUB-MASTEMA-17-16, JUB-MASTEMA-18-9, JUB-MASTEMA-18-12, JUB-MASTEMA-19-28, JUB-MASTEMA-48-2, JUB-MASTEMA-48-9, JUB-MASTEMA-48-12, JUB-MASTEMA-48-15, JUB-MASTEMA-49-2]
    confidence: high

  - id: CLM-DIRECT-QUMRAN-JUB-MASTEMA-COVERAGE
    proposition: "Within the published Qumran Jubilees passage-coverage set recorded here, no surviving direct Hebrew Jubilees fragment covers a named-Mastema locus."
    confidence: high-for-recorded-coverage-set
    ceiling: "Missing fragment coverage is not evidence that the Hebrew original lacked Mastema."

  - id: CLM-4Q225-ANCIENT-HEBREW-MASTEMA
    proposition: "4Q225 preserves ancient Hebrew Mastema language in an Akedah retelling closely related to Jubilees."
    confidence: high
    ceiling: "4Q225 is related Pseudo-Jubilees evidence, not a direct Jubilees manuscript."

  - id: CLM-LATIN-48-2-EXTERNAL-WITNESS
    proposition: "The fifth-century Latin Jubilees palimpsest has preserved-range coverage that includes Jubilees 48:2."
    confidence: high-for-range-coverage
    ceiling: "This does not establish Latin preservation of every Mastema passage."

