distribution_control:
  proposition: "Belial is dominant in much sectarian Qumran terminology, while Mastema/Angel-of-mśṭmh terminology is more characteristic of non-sectarian/reworked-scripture traditions."
  evidence: "Devorah Dimant, Between Qumran Sectarian and Non-Sectarian Texts: The Case of Belial and Mastema"
  inference_ceiling: "Distribution difference supports caution about identity; it does not prove total independence of traditions."

bounded_conclusions:
  - "There is a continuous Jewish problem-space of accusation, hostile spirits, heavenly rebellion, temptation, hostile rule, and final judgment."
  - "Jubilees strongly reworks Enochic Watcher/demon tradition."
  - "4Q225 strongly reflects/rewrites the Jubilees Mastema Akedah tradition."
  - "Jubilees 10:11 is a strong local Mastema/satan bridge."
  - "1QM 13:10-11 plus 4Q495 frg. 2,3 is a strong Belial/mśṭmh lexical bridge."
  - "Functional and lexical overlap do not establish one entity or one direct genealogy."
  - "The best current model is a network of related and partially convergent hostile-power traditions, not a single linear family tree."

