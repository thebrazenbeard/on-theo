claims:
  - id: CLM-SHEOL-NOT-AUTOMATIC-GEHENNA
    proposition: "Biblical Sheol language should not be treated by default as identical with later Gehenna or a fully developed Christian hell system."
    claim_type: SEMANTIC_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-JOB-7-9, SCH-CAMBRIDGE-AFTERLIFE-DICTIONARY, SCH-HTR-2026-NEPES-SHEOL]
    confidence: high
    contested: false

  - id: CLM-DANIEL12-RESURRECTION
    proposition: "Daniel 12:2-3 explicitly depicts many sleepers in the dust awakening to differentiated enduring destinies."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-DANIEL-12-2-3]
    confidence: high
    contested: false
    ceiling: "The text's wording is not silently expanded into a fully universal systematic doctrine."

  - id: CLM-SECOND-TEMPLE-RESURRECTION-AND-SOUL-MODELS-DIVERSE
    proposition: "Second Temple Jewish literature includes materially different postmortem configurations, including bodily-resurrection/vindication and immortal-soul/heavenly-continuity models."
    claim_type: HISTORICAL_LITERARY_SYNTHESIS
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-DANIEL-12-2-3, SRC-2MACCABEES-7, SRC-4MACCABEES, SCH-CAMBRIDGE-AFTERLIFE-DICTIONARY, SCH-NTS-2026-MARK-RESURRECTION]
    confidence: high
    contested: false

  - id: CLM-JOSEPHUS-REPRESENTS-AFTERLIFE-DISAGREEMENT
    proposition: "Josephus represents major Jewish groups as holding materially different positions about soul, reward/punishment, and postmortem fate."
    claim_type: TEXTUAL_HISTORIOGRAPHIC_REPRESENTATION
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-JOSEPHUS-WAR-2, SRC-JOSEPHUS-ANTIQUITIES-18]
    confidence: high-for-Josephus-representation
    contested: false
    ceiling: "Josephus's representation does not exhaust Jewish diversity or provide unmediated group self-description."

  - id: CLM-JEREMIAH-HINNOM-NOT-FULL-HELL
    proposition: "Jeremiah 7 presents the Valley of Ben-Hinnom/Topheth as an earthly place of condemned cultic practice and threatened slaughter, not as a fully articulated postmortem hell system."
    claim_type: TEXTUAL_SEMANTIC_CONTROL
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-JEREMIAH-7-31-33]
    confidence: high
    contested: false

  - id: CLM-GEHENNA-DEVELOPMENT-FLUID
    proposition: "Later Jewish Gehenna traditions exhibit multiple temporal and anthropological configurations, so Gehenna should not be treated as one perfectly stable afterlife model."
    claim_type: RECEPTION_AND_SEMANTIC_DEVELOPMENT
    evidence_class: [SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-MILIKOWSKY-1988-GEHENNA]
    confidence: high-for-diversity
    contested: false

