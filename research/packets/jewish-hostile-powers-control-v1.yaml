claims:
  - id: CLM-JOB-HA-SATAN-DIVINE-COURT
    proposition: "Job 1-2 presents ha-satan as a heavenly/divine-court accuser or adversarial functionary who acts only within limits granted by YHWH."
    claim_type: TEXTUAL_OCCURRENCE_AND_SEMANTIC_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-JOB-1-2, SCH-OXFORD-JOB-2021, SCH-STOKES-2025-SATAN-DEVELOPMENT]
    confidence: high
    contested: false
    ceiling: "This does not identify Job's figure with the fully developed later Devil."

  - id: CLM-ZECHARIAH-SATAN-ACCUSER
    proposition: "Zechariah 3 depicts the satan as an accuser in a heavenly/juridical scene and YHWH rebukes him."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-ZECHARIAH-3]
    confidence: high
    contested: false

  - id: CLM-ENOCH-WATCHERS-DEMON-ETIOLOGY
    proposition: "The Book of the Watchers develops rebellious-heavenly-being traditions and an etiology in which destructive spirits associated with the dead giants continue to afflict humanity."
    claim_type: TEXTUAL_AND_LITERARY_DEVELOPMENT
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-1ENOCH-WATCHERS, SCH-STOKES-2019-SATANOLOGY]
    confidence: high-for-developed-tradition
    contested: true
    ceiling: "Watchers and giant spirits are not collapsed into one entity class."

  - id: CLM-JUBILEES-MASTEMA-LEADING-HOSTILE-POWER
    proposition: "Jubilees presents Mastema as a leading hostile/testing figure associated with harmful spirits while remaining within a world governed by God."
    claim_type: TEXTUAL_LITERARY_SYNTHESIS
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-JUBILEES-MASTEMA, SCH-REED-2020-JUBILEES-DEMONS, SCH-STOKES-2019-SATANOLOGY]
    confidence: high-for-role-family
    contested: false
    ceiling: "Mastema is not promoted to a coequal anti-God."

  - id: CLM-JUBILEES-DEMON-TERMINOLOGY-SIMPLE
    proposition: "Jubilees' surviving versional terminology can be translated into one stable English demon vocabulary without textual-critical qualification."
    claim_type: TEXTUAL_SEMANTIC_OVERGENERALIZATION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SCH-PATMORE-2023-JUBILEES-DEMONOLOGY]
    confidence: unresolved
    contested: true

  - id: CLM-QUMRAN-BELIAL-LEADING-HOSTILE-POWER
    proposition: "Selected Qumran texts use Belial as the proper name/designation of a leading hostile power associated with deception, hostile spirits, the present wicked age, or eschatological opposition."
    claim_type: TEXTUAL_LITERARY_SYNTHESIS
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-QUMRAN-BELIAL-COMPLEX, SCH-STOKES-2019-SATANOLOGY, SCH-VANDERKAM-MASTEMA-QUMRAN]
    confidence: high
    contested: false
    ceiling: "Not every occurrence of belial across Hebrew/Jewish literature is a proper name."

  - id: CLM-MASTEMA-BELIAL-SATAN-ONE-IDENTICAL-FIGURE
    proposition: "Mastema, Belial, Satan, the Watchers, and all demonic spirits are one identical supernatural character with one continuous biography across Second Temple Jewish texts."
    claim_type: IDENTITY_AND_TRANSMISSION_OVERGENERALIZATION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SCH-STOKES-2019-SATANOLOGY, SCH-REED-2020-JUBILEES-DEMONS, SCH-VANDERKAM-MASTEMA-QUMRAN]
    confidence: unresolved
    contested: false

