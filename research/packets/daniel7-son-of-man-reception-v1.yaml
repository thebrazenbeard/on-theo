claims:
  - id: CLM-DANIEL7-HUMANLIKE-FIGURE-TEXT
    proposition: "Daniel 7:13-14 presents one like a human being receiving dominion, glory and kingship from the Ancient of Days."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-DANIEL-7]
    confidence: high
    contested: false

  - id: CLM-DANIEL7-HOLY-ONES-INTERPRETATION
    proposition: "Daniel 7's interpreting section assigns receipt and possession of the kingdom to the holy ones / people of the holy ones of the Most High."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-DANIEL-7]
    confidence: high
    contested: false

  - id: CLM-DANIEL7-FIGURE-ORIGINAL-REFERENT
    proposition: "The one-like-a-human figure in Daniel 7 has one uncontested original referent that can be specified without interpretive argument."
    claim_type: HISTORICAL_SEMANTIC_INTERPRETATION
    evidence_class: [SCHOLARLY_INTERPRETATION, UNKNOWN]
    supporting_sources: []
    opposing_sources: [SCH-BOYARIN-2012-DANIEL7]
    confidence: unresolved
    contested: true

  - id: CLM-DANIEL7-SON-MAN-FIXED-TITLE
    proposition: "Daniel 7:13 itself establishes 'Son of Man' as a fixed personal title for a single eschatological redeemer."
    claim_type: LEXICAL_SEMANTIC_INTERPRETATION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SRC-DANIEL-7, SCH-BURKETT-EXIT-APOCALYPTIC]
    confidence: unresolved
    contested: true

  - id: CLM-LATER-JEWISH-DANIELIC-INDIVIDUALIZATION
    proposition: "Later Jewish apocalyptic texts such as the Similitudes of Enoch and 4 Ezra 13 can individualize and messianically develop Danielic humanlike-figure imagery."
    claim_type: RECEPTION_AND_LITERARY_DEVELOPMENT
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-1ENOCH-SIMILITUDES, SRC-4EZRA-13, SCH-SLATER-1995-SON-MAN-FIRST-CENTURY]
    confidence: high-for-later-individualization
    contested: true
    ceiling: "The development does not determine Daniel 7's earliest referent or prove one universally shared first-century doctrine."

  - id: CLM-UNIVERSAL-FIRST-CENTURY-SON-MAN-DOCTRINE
    proposition: "First-century Judaism had one universally recognized eschatological redeemer with a fixed title 'the Son of Man' and a stable agreed set of functions."
    claim_type: HISTORICAL_GENERALIZATION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SCH-BURKETT-APOCALYPTIC-RABBINIC, SCH-SLATER-1995-SON-MAN-FIRST-CENTURY]
    confidence: unresolved
    contested: true

  - id: CLM-DANIELIC-FIGURE-LEXICALLY-EQUALS-MESSIAH
    proposition: "Daniel 7:13 lexically identifies its humanlike figure with the category/title messiah."
    claim_type: SEMANTIC_IDENTITY
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SRC-DANIEL-7]
    confidence: unresolved
    contested: false
    ceiling: "Later messianic identification is reception and must be source-bound."

