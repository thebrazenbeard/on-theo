claims:
  - id: CLM-MASHIACH-LEXEME-NOT-ONE-ESCHATOLOGICAL-ROLE
    proposition: "Biblical anointing/mashiach language is used for different authorized figures including an anointed priest, Saul as YHWH's anointed king, and Cyrus as YHWH's anointed; the lexeme alone therefore does not specify one future eschatological office."
    claim_type: LEXICAL_TEXTUAL_CONTROL
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-LEVITICUS-4-3, SRC-1SAMUEL-24-11, SRC-ISAIAH-45-1]
    confidence: high
    contested: false

  - id: CLM-PSALMS-SOLOMON-17-DAVIDIC-ROYAL
    proposition: "Psalms of Solomon 17 presents a future Davidic royal figure who rules and judges Israel, providing a clear source-specific royal messianic expectation."
    claim_type: TEXTUAL_OCCURRENCE_AND_SEMANTIC_CLASSIFICATION
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-PSALMS-SOLOMON-17, SCH-BURKETT-JEWISH-MESSIANIC-HOPES]
    confidence: high
    contested: false
    ceiling: "This source does not establish that every Second Temple Jewish group held the same expectation."

  - id: CLM-1QS-PLURAL-ESCHATOLOGICAL-FIGURES
    proposition: "1QS 9:10b-11 distinguishes a prophet from messiahs of Aaron and Israel, supporting a source-specific plurality of eschatological offices."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-1QS-9-11, SCH-JURIDICAL-PROPHET-QUMRAN]
    confidence: high-for-wording-moderate-for-role-identification
    contested: true
    ceiling: "The precise functions and relation of the named figures require interpretation."

  - id: CLM-RULE-SCROLL-MESSIANISM-NOT-UNIFORM
    proposition: "The Rule Scroll corpus/manuscript tradition does not express messianic expectation in one perfectly uniform formula across 1QS, 1QSa, 1QSb and all 4QS evidence."
    claim_type: TEXTUAL_HISTORY
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-1QS-9-11, SRC-1QSB-WORDS-BLESSING, SCH-RULE-SCROLL-MESSIAH-VARIATION-2025]
    confidence: high
    contested: false
    ceiling: "Variation inside this corpus does not by itself quantify prevalence across wider Judaism."

  - id: CLM-4Q521-MESSIAH-ROLE
    proposition: "4Q521 contains messianic/restoration language, but the specific role of its messianic figure is interpretively contested and cannot be assumed to be a standard Davidic king."
    claim_type: TEXTUAL_SEMANTIC_INTERPRETATION
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-4Q521, SCH-COLLINS-4Q521-MESSIAH]
    confidence: high-for-role-contestation
    contested: true

  - id: CLM-SECOND-TEMPLE-ONE-UNIVERSAL-MESSIAH-JOB-DESCRIPTION
    proposition: "Second Temple Judaism had one universally agreed messianic job description shared across communities and sources."
    claim_type: HISTORICAL_GENERALIZATION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources:
      - SRC-PSALMS-SOLOMON-17
      - SRC-1QS-9-11
      - SRC-1QSB-WORDS-BLESSING
      - SRC-4Q521
      - SCH-RULE-SCROLL-MESSIAH-VARIATION-2025
    confidence: unresolved
    contested: true

  - id: CLM-MESSIAH-TITLE-ENTAILS-INCARNATE-DIVINITY
    proposition: "The Jewish title/category messiah or anointed one by itself entails preexistence, incarnation, ontological identity with God, or later Trinitarian doctrine."
    claim_type: SEMANTIC_OVERPROMOTION
    evidence_class: [UNKNOWN]
    supporting_sources: []
    opposing_sources: [SRC-LEVITICUS-4-3, SRC-1SAMUEL-24-11, SRC-ISAIAH-45-1, SRC-PSALMS-SOLOMON-17, SRC-1QS-9-11]
    confidence: unresolved
    contested: false

