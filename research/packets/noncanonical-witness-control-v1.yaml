claims:
  - id: CLM-THOMAS-WITNESSES-SEPARATE-FROM-COMPOSITION
    proposition: "The Gospel of Thomas is physically witnessed by third-century Greek Oxyrhynchus fragments and a fourth-century Coptic Nag Hammadi codex, but those witness dates do not by themselves settle original composition."
    claim_type: WITNESS_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-EPP-2004-OXYRHYNCHUS-PAPYRI, SCH-WATSON-2026-NAG-HAMMADI-CONTEXT]
    confidence: high
    contested: false

  - id: CLM-PROTOJAMES-BODMER-WITNESS-NOT-COMPOSITION
    proposition: "Papyrus Bodmer V is an early physical witness to the Protoevangelium of James; its late-third/fourth-century witness date is not automatically the composition date of the work."
    claim_type: WITNESS_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-CAMBRIDGE-PROTOJAMES-BODMER]
    confidence: high
    contested: false

  - id: CLM-IGT-OLDER-VERSIONS-PRECEDE-SURVIVING-GREEK-S
    proposition: "For the Infancy Gospel of Thomas, fifth-century Latin and sixth-century Syriac short-recension witnesses predate the surviving eleventh-century Greek S-recension manuscript and are relevant to reconstruction of the older text-form."
    claim_type: TEXTUAL_HISTORY
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-NTS-2023-IGT-TEXTUAL-HISTORY]
    confidence: high
    contested: false

  - id: CLM-GOSPEL-PETER-AKHMIM-DATE-NOT-WORK-DATE
    proposition: "The Akhmim manuscript traditionally identified with the Gospel of Peter is palaeographically much later than the commonly proposed second-century composition of the work."
    claim_type: WITNESS_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-FOSTER-2006-GOSPEL-PETER-FRAGMENTS, SCH-DELC0GLIANO-2022-GOSPEL-PETER]
    confidence: high
    contested: false

  - id: CLM-GOSPEL-PETER-EARLY-FRAGMENTS-AUTOMATIC
    proposition: "Proposed early papyrus fragments can be treated automatically as physical witnesses of the same Gospel of Peter text represented by the Akhmim codex."
    claim_type: WITNESS_IDENTIFICATION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    supporting_sources: []
    opposing_sources: [SCH-FOSTER-2006-GOSPEL-PETER-FRAGMENTS]
    confidence: unresolved
    contested: true

  - id: CLM-NONCANONICAL-STATUS-PROVES-AUTHENTICITY
    proposition: "A text's noncanonical status makes it earlier, historically more authentic, or evidence of suppressed truth."
    claim_type: PROJECT_INFERENCE
    evidence_class: [UNKNOWN]
    supporting_sources: []
    confidence: unresolved
    contested: false
    ceiling: "Canon status and historical/source quality are separate variables."

