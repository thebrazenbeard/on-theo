claims:
  - id: CLM-MARY-MAGDALENE-CANONICAL-PASSION-TOMB-PROMINENCE
    proposition: "Across the canonical gospel narratives, Mary Magdalene is repeatedly named at the passion, burial/tomb, or resurrection-proclamation boundary."
    claim_type: TEXTUAL_COMPARISON
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-GOSPEL-MARK, SRC-GOSPEL-MATTHEW, SRC-GOSPEL-LUKE, SRC-GOSPEL-JOHN]
    confidence: high
    contested: false
    ceiling: "This is a textual-distribution claim, not a claim that all narrative details are independent historical eyewitness reports."

  - id: CLM-JOHN20-MARY-MESSENGER-TO-DISCIPLES
    proposition: "John 20 narrates Mary Magdalene encountering the risen Jesus and reporting to the disciples that she has seen the Lord."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-GOSPEL-JOHN]
    confidence: high
    contested: false

  - id: CLM-CANONICAL-MARY-NOT-NAMED-PROSTITUTE
    proposition: "No canonical Gospel passage identifies Mary Magdalene as a prostitute."
    claim_type: CANONICAL_CORPUS_TEXTUAL_NEGATIVE
    evidence_class: [PRIMARY_TEXT]
    supporting_sources: [SRC-GOSPEL-MARK, SRC-GOSPEL-MATTHEW, SRC-GOSPEL-LUKE, SRC-GOSPEL-JOHN]
    confidence: high
    contested: false
    ceiling: "The claim concerns canonical wording/identity, not every later interpretation of the gospel women."

  - id: CLM-GOSPEL-MARY-PRIVILEGED-REVELATION
    proposition: "The surviving Gospel of Mary presents Mary reporting privileged teaching/revelation and contains a dispute over accepting her report."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION]
    supporting_sources: [SRC-GOSPEL-MARY]
    confidence: high-at-extant-text-level
    contested: false

  - id: CLM-GOSPEL-MARY-MARY-IS-MAGDALENE
    proposition: "The Mary who appears in the Gospel of Mary is specifically Mary Magdalene."
    claim_type: CHARACTER_IDENTIFICATION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    supporting_sources: [SCH-CAMBRIDGE-2017-FEMALE-EXEMPLA]
    opposing_sources: [SCH-BASS-2007-GOSPEL-MARY]
    confidence: common-identification-but-contested
    contested: true

  - id: CLM-GOSPEL-MARY-PETER-CONFLICT-IS-HISTORICAL-SUCCESSION
    proposition: "The Gospel of Mary's literary Mary/Peter dispute directly preserves a historical succession struggle between the actual Mary Magdalene and Peter."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION, UNKNOWN]
    supporting_sources: [SCH-BROCK-2000-2002-MARY-PETER-AUTHORITY]
    opposing_sources: [SCH-BASS-2007-GOSPEL-MARY]
    confidence: unresolved
    contested: true
    ceiling: "Literary authority conflict is established more strongly than direct historical succession reconstruction."

  - id: CLM-GREGORY-591-COMPOSITE-MARY
    proposition: "Gregory the Great's 591 Western preaching is a major consolidation point identifying Mary Magdalene with Mary of Bethany and Luke's unnamed sinful woman."
    claim_type: RECEPTION_HISTORY
    evidence_class: [LATER_TRADITION, SCHOLARLY_INTERPRETATION]
    supporting_sources: [SRC-GREGORY-HOMILY-33, SCH-ALMOND-2022-MARY-MAGDALENE]
    confidence: high
    contested: false
    ceiling: "Major consolidation point does not mean Gregory invented every earlier association."

  - id: CLM-COORDINATED-SUPPRESSION-OF-MARY
    proposition: "The composite sexual-sinner/prostitute reception of Mary Magdalene was deliberately created as one coordinated institutional strategy to suppress her historically documented succession authority."
    claim_type: MOTIVE_AND_HISTORICAL_CAUSATION
    evidence_class: [PROJECT_INFERENCE, UNKNOWN]
    supporting_sources: []
    opposing_sources: [SCH-BASS-2007-GOSPEL-MARY]
    confidence: unresolved
    contested: true
    ceiling: "Authority-reducing effects can be studied without inferring one coordinated intent."

