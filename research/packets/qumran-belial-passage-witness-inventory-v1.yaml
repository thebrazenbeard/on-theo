claims:
  - id: CLM-QUMRAN-BELIAL-PERSONIFIED-MULTICORPUS
    proposition: "Personified Belial occurs across multiple Qumran textual corpora rather than in one isolated composition."
    confidence: high
  - id: CLM-BELIAL-DIVINELY-SUBORDINATED-1QM
    proposition: "1QM 13:10-11 portrays Belial as made/appointed by God for destruction and labels him an angel of hostility."
    confidence: high
  - id: CLM-BELIAL-MASTEMA-LEXICAL-BRIDGE-NOT-IDENTITY
    proposition: "The מלאך משטמה phrase in 1QM 13:10-11 creates a real lexical hostility-word-family bridge but does not establish Belial = Jubilees' Mastema."
    confidence: high
  - id: CLM-RAW-BELIAL-CONCORDANCE-IS-PERSONIFIED-INVENTORY
    proposition: "Every Qumran occurrence of בליעל denotes the personified hostile power Belial."
    confidence: unresolved
    supporting_evidence: []
    opposing_evidence: [ABSTRACT_AND_AMBIGUOUS_LEXICAL_USES]

