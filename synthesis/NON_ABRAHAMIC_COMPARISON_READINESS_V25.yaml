  Mexica/Nahua evidence is comparison-ready only through explicit polity,
  community, region, period and evidence-mode labels. Imperial Mexica material,
  colonial Nahua manuscript layers, conquest-boundary pictorial evidence and
  living regional Nahua traditions are not interchangeable.

