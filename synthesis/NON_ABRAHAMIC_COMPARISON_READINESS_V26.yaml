olmec_method_result: >
  Olmec evidence is comparison-ready only on questions answerable by material,
  spatial and tightly controlled iconographic evidence. Cascajal strengthens
  the case for Olmec writing but remains undeciphered, so it contributes no
  readable theological propositions. Recurrent visual complexes do not license
  native deity names or a systematic pantheon, and broad Olmec interaction does
  not justify a one-way mother-culture religious-transmission model.

