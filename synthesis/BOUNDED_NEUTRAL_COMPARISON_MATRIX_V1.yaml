axes:
  WORLD_ORIGIN_MODEL:
    buddhism:
      status: NOT_ADMITTED
      note: current bounded Buddhist packet does not admit a creator/origin proposition
    hindu:
      status: BOUNDED
      evidence: RV_10_129
      summary: origin inquiry culminates in explicit uncertainty about who knows
    daoism:
      status: BOUNDED
      evidence: DDJ_25_plus_selected_Zhuangzi_6
      summary: Dao is described as prior to heaven_and_earth without being bound as a sovereign creator
    shinto:
      status: BOUNDED
      evidence: KOJIKI_NIHON_SHOKI_VARIANT_MATRIX
      summary: multiple classical cosmogonic/genealogical accounts must remain variant
    norse:
      status: BOUNDED
      evidence: VOLUSPA_STANZAS_3_4
      summary: primordial absence/Ginnungagap and later world-shaping by divine agents
    sumerian:
      status: NOT_ADMITTED
      note: current bridge does not bind a specific cosmogony strongly enough for this cell

  CAUSAL_ORDER_TYPE:
    buddhism:
      status: BOUNDED
      evidence: SN_12_2_SN_12_15_plus_parallels
      summary: conditioned relational explanation is source-supported without requiring a root sovereign agent
    hindu:
      status: PARTIAL
      evidence: BU_4_4_2_6_CHU_6_8_7
      summary: desire_action_becoming and self/essence material exist but do not form one settled causal architecture
    daoism:
      status: BOUNDED
      evidence: DDJ_25_37_40_51
      summary: generative noncoercive and self-transforming order is source-supported in selected loci
    shinto:
      status: PARTIAL
      evidence: KIKI_VARIANTS_PLUS_RITUAL
      summary: multiple agent/genealogical and ritual structures are preserved; no single causal system is admitted
    norse:
      status: PARTIAL
      evidence: VOLUSPA
      summary: divine action and fate structure are present but no single complete causal ontology is admitted
    sumerian:
      status: PARTIAL
      evidence: SOURCE_VERIFICATION_AND_INSTITUTIONAL_MATERIAL
      summary: divine authority city cult and kingship are bound; one universal causal order is not

  PERSON_OR_SELF_MODEL:
    buddhism:
      status: BOUNDED
      evidence: SN_22_59_SN_44_10_plus_cross_transmission
      summary: five aggregates are not-self; simple existence/no-self binary is methodologically inadequate
    hindu:
      status: PARTIAL
      evidence: BU_4_4_2_6_CHU_6_8_7
      summary: self/continuity language is present but tat_tvam_asi and later Vedanta mappings remain controlled
    daoism:
      status: PARTIAL
      evidence: ZHUANGZI_INNER_2_6
      summary: identity and form are treated through perspective and transformation
    shinto:
