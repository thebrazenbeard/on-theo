modern_satanism_method_result: >
  Modern Satanism is comparison-ready only as a family of source-specific
  reappropriations. Church of Satan, The Satanic Temple and theistic/esoteric
  currents differ in Satan referent, selfhood, ritual, authority and
  institutional form. Historical accusations of devil worship remain a separate
  evidence problem.

contact_schema:
  ADVERSARIAL_SYMBOL_REVALUATION:
    status: ADDED_SUBTYPE
    definition: >
      A negatively inherited religious/adversarial figure or category is
      intentionally reappropriated and positively recoded by a later
      self-identified movement.
    guard: >
      Reappropriation does not imply continuity of the earlier hostile
      attribution or agreement with the earlier source's ontology.

next_frontier:
