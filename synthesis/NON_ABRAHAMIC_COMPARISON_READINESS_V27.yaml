dine_method_result: >
  Diné public law and community-controlled institutional sources support bounded
  comparison of knowledge governance, institutionalization, current sovereignty,
  offering protocol and continuity without requiring access to restricted
  ceremonial knowledge. The Navajo Nation's own cultural-resource policy makes
  restricted knowledge a legitimate stopping condition rather than missing data.

