schema_version: on-theo.attribution-identification-method-schema.v1
status: NON_CANONICAL_SOURCE_CRITICISM_SCHEMA

exact_test_heads:
  modern_satanism: bb2bdf915b9ac08f63b881f22b1d0023ae73debc
  devil_worship_accusation_pre_audit: 7fa4c233d93bfd1cc79b0c1614c569956b2e566a
  andean_inca: 355d808e5d55185d50f1dcabb53003635b88a23f
  mexica_nahua: 00e37e475f3669ef2ee040908b126617ffcd17da

purpose: >
  Prevent labels supplied by opponents, prosecutors, missionaries, colonizers,
  investigators or later scholars from being silently converted into the
  target person's or group's own religious identity, belief or practice.

required_dimensions:
  ATTRIBUTION_STATUS:
    values:
      - SELF_IDENTIFIED
      - INTERNAL_ORGANIZATIONAL_LABEL
      - OUTSIDER_ATTRIBUTION
      - POLEMICAL_ATTRIBUTION
      - LEGAL_ALLEGATION
      - DEMONOLOGICAL_THEORY
      - COLONIAL_TRANSLATION
      - FOLKLORE_OR_CONSPIRACY
      - SCHOLARLY_ANALYTIC_LABEL
      - MIXED_OR_DISPUTED

  TARGET_VOICE_STATUS:
    values:
      - DIRECT_SELF_DESCRIPTION
      - INTERNAL_COMMUNITY_DESCRIPTION
      - MEDIATED_TARGET_TESTIMONY
      - HOSTILE_SOURCE_ONLY
      - TARGET_VOICE_ABSENT
      - UNKNOWN

  SELF_IDENTIFICATION_STATUS:
    values:
      - EXPLICIT_POSITIVE
      - EXPLICIT_REJECTION
      - PARTIAL_OR_CONTESTED
      - NOT_ATTESTED
      - UNKNOWN

  BEHAVIORAL_CORROBORATION_STATUS:
    values:
      - INDEPENDENTLY_CORROBORATED
      - PARTIALLY_CORROBORATED
      - SYMBOLIC_CONTEXT_ONLY
      - TESTIMONY_ONLY
      - NOT_CORROBORATED
      - NOT_APPLICABLE
      - UNKNOWN

  INSTITUTIONAL_CONTEXT:
    values:
      - SELF_ORGANIZATION
      - RELIGIOUS_POLEMIC
      - INQUISITORIAL_OR_JUDICIAL
      - MISSIONARY_OR_COLONIAL
      - LAW_ENFORCEMENT
      - THERAPEUTIC
      - MEDIA
      - SCHOLARLY
      - MIXED

  LABEL_SEMANTIC_DISTANCE:
    values:
      - SOURCE_INTERNAL_AND_ACCEPTED
      - SOURCE_INTERNAL_CONTESTED
      - EXTERNAL_NEAR_EQUIVALENT
      - EXTERNAL_RECODING
      - HOSTILE_INVERSION
      - SEMANTICALLY_INCOMMENSURATE
      - UNKNOWN

method_rules:
  - LABEL_CLAIM_AND_PRACTICE_CLAIM_ARE_SEPARATE
  - TARGET_SELF_DESCRIPTION_OUTRANKS_HOSTILE_LABEL_FOR_TARGET_IDENTITY
  - TARGET_SELF_DESCRIPTION_DOES_NOT_BY_ITSELF_PROVE_HISTORICAL_OR_BEHAVIORAL_CLAIMS
  - HOSTILE_SOURCE_CAN_PRESERVE_OBSERVATION_WITH_DISTORTED_INTERPRETATION
  - CONFESSION_REQUIRES_PROCEDURAL_CONTEXT
  - LEGAL_ALLEGATION_REQUIRES_INDEPENDENT_CORROBORATION
  - COLONIAL_TRANSLATION_REQUIRES_SOURCE_INTERNAL_TERM_CONTROL
  - MODERN_REAPPROPRIATION_DOES_NOT_VALIDATE_EARLIER_ATTRIBUTION
  - SCHOLARLY_LABEL_MUST_NOT_BE_MISTAKEN_FOR_EMIC_IDENTITY

comparison_outputs:
  allowed:
    - ACCUSER_WORLDVIEW
    - BOUNDARY_MAKING
    - INSTITUTIONAL_SUPPRESSION
    - SEMANTIC_RECODING
    - SELF_IDENTIFIED_IDENTITY
    - BEHAVIORAL_PRACTICE_WHEN_CORROBORATED
  prohibited_without_independent_support:
    - TARGET_THEOLOGY_FROM_HOSTILE_LABEL
    - TARGET_ORGANIZATION_FROM_CONSPIRACY_CLAIM
    - TARGET_MOTIVE_FROM_SYMBOLS_ALONE
